name: compile-mainline-stable-kernel

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential flex bison libssl-dev libelf-dev dwarves zstd bc python3-dev python3-pip git wget curl
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Download kernel source
        run: |
          # 保持下载主线内核
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git -b linux-6.6.y linux
          
      - name: Integrate FullCone NAT Support
        run: |
          cd linux
          # 使用 wget 直接下载源码压缩包，避免 git clone 权限问题
          wget https://github.com/Lienol/openwrt-fullconenat/archive/refs/heads/master.tar.gz -O fullconenat.tar.gz
          mkdir -p net/netfilter/fullconenat
          tar -C net/netfilter/fullconenat -xzvf fullconenat.tar.gz --strip-components=1
          
          # 修改 Makefile 和 Kconfig
          sed -i '/obj-$(CONFIG_IP_NF_TARGET_NETMAP) += ipt_NETMAP.o/a obj-$(CONFIG_IP_NF_TARGET_FULLCONENAT) += fullconenat/ipt_FULLCONENAT.o' net/ipv4/netfilter/Makefile
          sed -i '/config IP_NF_TARGET_NETMAP/i source "net/netfilter/fullconenat/Kconfig"' net/ipv4/netfilter/Kconfig

      - name: Configure Kernel Features (For daed & Docker)
        run: |
          cd linux
          # 生成默认配置
          make defconfig 
          
          # 开启所有缺失的依赖
          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_BPF_EVENTS
          ./scripts/config --enable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --module CONFIG_NET_CLS_BPF
          ./scripts/config --module CONFIG_NET_ACT_BPF
          ./scripts/config --enable CONFIG_XDP_SOCKETS
          ./scripts/config --module CONFIG_XDP_SOCKETS_DIAG
          ./scripts/config --module CONFIG_IP_NF_TARGET_FULLCONENAT
          
          # 自动应用新配置
          make olddefconfig

      - name: Compile kernel
        run: |
          cd linux
          # Amlogic S912 编译参数
          make -j$(nproc) Image.gz modules dtbs

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S912-Kernel-Fixed
          path: |
            linux/arch/arm64/boot/Image.gz
            linux/arch/arm64/boot/dts/amlogic/*.dtb
            linux/.config
