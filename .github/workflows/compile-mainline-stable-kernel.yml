name: compile-mainline-stable-kernel

on:
  workflow_dispatch:
  # 保持原有的定时或推送触发逻辑（如果原版有的话）
  # schedule:
  #   - cron: '0 0 * * 5'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          # 在原版基础上增加了 dwarves (用于生成 BTF)，这是解决 daed 依赖的核心
          sudo -E apt-get -qq install -y build-essential flex bison libssl-dev libelf-dev dwarves zstd bc python3-dev python3-pip git wget curl
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Download kernel source
        run: |
          # 保持原版下载逻辑，这里以 6.18.y 为例
          git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git -b linux-6.18.y linux

      - name: Integrate FullCone NAT Support
        run: |
          cd linux
          # 使用 curl 下载源码包避开 git clone 权限错误 (exit code 128)
          curl -L https://github.com/Lienol/openwrt-fullconenat/archive/refs/heads/master.tar.gz -o fullconenat.tar.gz
          mkdir -p net/netfilter/fullconenat
          tar -xzvf fullconenat.tar.gz -C net/netfilter/fullconenat --strip-components=1
          
          # 修改内核 Makefile 和 Kconfig 挂载补丁
          echo "obj-\$(CONFIG_IP_NF_TARGET_FULLCONENAT) += fullconenat/ipt_FULLCONENAT.o" >> net/ipv4/netfilter/Makefile
          sed -i '/menu "IP: Netfilter Configuration"/a source "net/netfilter/fullconenat/Kconfig"' net/ipv4/netfilter/Kconfig

      - name: Configure Kernel Features (For daed & Docker)
        run: |
          # 这里的路径对应你之前提到的 kernel-config 路径
          CONF_FILE="kernel-config/release/stable/config-6.18"
          
          if [ -f "$CONF_FILE" ]; then
            echo "正在注入 daed 和 FullCone NAT 依赖配置..."
            # 开启 eBPF/BTF/XDP 支持 (解决 kmod-sched-bpf, kmod-xdp-sockets-diag)
            sed -i '/CONFIG_BPF_SYSCALL/d' $CONF_FILE
            sed -i '/CONFIG_DEBUG_INFO_BTF/d' $CONF_FILE
            echo "CONFIG_BPF_SYSCALL=y" >> $CONF_FILE
            echo "CONFIG_BPF_JIT=y" >> $CONF_FILE
            echo "CONFIG_BPF_EVENTS=y" >> $CONF_FILE
            echo "CONFIG_DEBUG_INFO_BTF=y" >> $CONF_FILE
            echo "CONFIG_NET_CLS_BPF=m" >> $CONF_FILE
            echo "CONFIG_NET_ACT_BPF=m" >> $CONF_FILE
            echo "CONFIG_XDP_SOCKETS=y" >> $CONF_FILE
            echo "CONFIG_XDP_SOCKETS_DIAG=m" >> $CONF_FILE
            # 开启 FullCone NAT 模块 (解决 kmod-ipt-fullconenat)
            echo "CONFIG_IP_NF_TARGET_FULLCONENAT=m" >> $CONF_FILE
          fi
          
          # 将修改后的配置移动到源码目录进行编译
          cp $CONF_FILE linux/.config
          cd linux
          make olddefconfig

      - name: Compile the kernel
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_version: 6.18.y
          kernel_auto: true
          kernel_sign: -S912-daed-fullcone

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S912-Kernel-Standard-Integrated
          path: output/kernel/*
