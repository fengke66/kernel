name: compile-mainline-stable-kernel

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          # 【核心】必须安装 dwarves (pahole)，否则无法生成 daed 依赖的 BTF 模块
          sudo -E apt-get -qq install -y build-essential flex bison libssl-dev libelf-dev dwarves zstd bc python3-dev python3-pip git wget curl
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Inject daed & FullCone Configs
        run: |
          # 针对你指定的 6.18 配置文件进行修改
          CONF_FILE="kernel-config/release/stable/config-6.18"
          
          if [ -f "$CONF_FILE" ]; then
            echo "--- 开始注入依赖配置 ---"
            # 解决 kmod-sched-bpf, kmod-xdp-sockets-diag (daed 依赖)
            sed -i '/CONFIG_BPF_SYSCALL/d' $CONF_FILE
            sed -i '/CONFIG_DEBUG_INFO_BTF/d' $CONF_FILE
            echo "CONFIG_BPF_SYSCALL=y" >> $CONF_FILE
            echo "CONFIG_BPF_JIT=y" >> $CONF_FILE
            echo "CONFIG_BPF_EVENTS=y" >> $CONF_FILE
            echo "CONFIG_DEBUG_INFO_BTF=y" >> $CONF_FILE
            echo "CONFIG_NET_CLS_BPF=m" >> $CONF_FILE
            echo "CONFIG_NET_ACT_BPF=m" >> $CONF_FILE
            echo "CONFIG_XDP_SOCKETS=y" >> $CONF_FILE
            echo "CONFIG_XDP_SOCKETS_DIAG=m" >> $CONF_FILE
            
            # 解决 kmod-ipt-fullconenat
            sed -i '/CONFIG_IP_NF_TARGET_FULLCONENAT/d' $CONF_FILE
            echo "CONFIG_IP_NF_TARGET_FULLCONENAT=m" >> $CONF_FILE
            echo "--- 注入完成 ---"
          else
            echo "错误: 找不到文件 $CONF_FILE"
            exit 1
          fi

      - name: Compile the kernel
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_version: 6.18.y
          kernel_auto: true
          # 自定义签名，刷入后在系统里看到这个后缀就说明成功了
          kernel_sign: -S912-daed-fullconenat

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S912-Kernel-6.18-Stable
          path: output/kernel/*
